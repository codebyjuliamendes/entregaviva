name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: Frontend syntax
        run: for f in public/*.js; do node --check "$f"; done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  docker:
    name: Docker image + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: entregaviva:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name ev -p 3003:3003 --read-only -v ev-data:/data entregaviva:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ev)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' ev | grep -qx healthy
          curl -fsS http://localhost:3003/api/health
          code=$(curl -fsS -X POST http://localhost:3003/api/orders \
            -H 'Content-Type: application/json' \
            -d '{"restaurant":"Smoke Test","customer":"CI","address":"Rua CI, 1","total":12.5}' | jq -r .code)
          curl -fsS "http://localhost:3003/api/orders/track/$code" | jq -e '.status == "recebido" and (has("address") | not)'
          curl -fsS -o /dev/null http://localhost:3003/track.html
          docker stop -t 15 ev
          docker logs ev | tail -n 3 | grep -q '"msg":"stopped"'
      - name: Container logs
        if: failure()
        run: docker logs ev || true
